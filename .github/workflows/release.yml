name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify release tag matches project version
        if: github.event_name == 'release'
        shell: bash
        run: |
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          expected_tag="v${mod_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match expected tag '${expected_tag}'." >&2
            exit 1
          fi

      - name: Build
        run: ./gradlew clean build

      - name: Compute SHA-256 checksum
        working-directory: build/libs
        run: |
          jar_file="$(ls *.jar)"
          sha256sum "${jar_file}" > "${jar_file}.sha256"

      - name: Attach JAR and checksum to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/*.jar build/libs/*.sha256 --clobber
