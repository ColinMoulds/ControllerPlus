modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/controllerplus/icon.png"
logoBlur=false
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="controllerplus.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="required"
versionRange="${ae2_version_range}"
ordering="AFTER"
side="BOTH"

[features.${mod_id}]
javaVersion="[${java_version},)"
